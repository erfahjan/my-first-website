<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title> 
       <style>
 *{margin: 0%;
    padding: auto;
box-sizing: border-box;
        }
body{
    min-height: 100vh;
    background-image: url("thanks.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center

}
.login box{
    width: 400%;
    height: 400px;
padding: 30px;
margin-top: 7%;
text-align: center;
border-radius: 10px;
background-color: rgba(188, 144, 238, 0.2);
border: 2px solid rgba(228, 238, 230, 0.5);
border-radius: 15px;
backdrop-filter: blur(10px);
text-align: center;



}
.login box input{
    width: 90%;
padding: 10px;
margin: 10px;
border: none;
border-radius: 8px;
outline: none;

}
.login box button{
    cursor: pointer;
    color: rgb(177, 216, 104);
}

    </style>
</head>
<body>
    
    <div class="login box" style="border: 2px solid rgba(45, 72, 173, 0.5); border-radius: 15px;width: 500px; height: 500px; padding: 30px; margin-top: 7%; text-align: center; background-color: rgba(255, 255, 255, 0.2); backdrop-filter: transparent; text-align: center;">

        <h2 style="color: white; font-size: 30px; text-align: center;">
            sign up
        </h2>
     <h1>first name:   <input type="text" placeholder="First Name"></h1><br>
     <h1>last name:   <input type="text" placeholder="Last Name"></h1><br>
     <h1>Email/ph.: <input type="text" placeholder="Enter Email or phone number"></h1><br>
        <h1>Password: <input type="password" placeholder=" create password"><br>
        <button style="height: 30px; width: 30%; color: rgb(68, 68, 156); background-color: rgba(101, 219, 107, 0.656);  border-radius: 8px; cursor: pointer;
        margin-top: 20px;" ><a href="home.html">sign up</a></button><br>


    
</body>
</html>
