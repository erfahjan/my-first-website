<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login form</title>
    <title>My Website</title>
    <style>
        * {
            margin: 0%;
            padding: auto;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background-image: url("thanks.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login box {
            width: 400px;
            height: 300px;
            padding: 30px;
            margin-top: 7%;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        .login box input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            outline: none;
        }
        .login box button {
            cursor: pointer;
            color: rgb(177, 216, 104);
        }
    </style>
</head>
<body>
    <div class="login box" style="border: 2px solid rgba(45, 72, 173, 0.5); border-radius: 15px;width: 400px; height: 300px; padding: 30px; margin-top: 7%; text-align: center; background-color: rgba(255, 255, 255, 0.2); backdrop-filter: transparent; text-align: center;">
        <h2 style="color: white; font-size: 30px; text-align: center;">
            Login
        </h2>
        <h1>Username: <input id="username" type="text" placeholder="Username"></h1><br>
        <h1>Password: <input id="password" type="password" placeholder="password"></h1><br>
        <button id="loginBtn" type="button" style="height: 30px; width: 30%; color: rgb(0, 0, 19); background-color: rgba(45, 39, 208, 0.656); border-radius: 8px; cursor: pointer; margin-top: 20px; color: white;">Login</button><br>
        <h3 style="margin-top: 30px;"> <a href="register.html" style="text-decoration: none; color: white; font-size: 20px; margin-top: 20px;">sign up?</a> </h3>
    </div>

    
</body>
</html>
